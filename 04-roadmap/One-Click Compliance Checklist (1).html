<title>One-Click Compliance Checklist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: single centered column, top bar, then one of three screens (dashboard, checklist, confirmation). */
:root {
  --bg: #F3F5F6; --surface: #FFFFFF; --fg: #13202A; --muted: #566573; --line: #D6DDE2;
  --accent: #0E6B66; --accent-ink: #FFFFFF; --accent-soft: #DDEFEC;
  --warn: #7A4F00; --warn-soft: #FBEFD2; --bad: #B3261E; --bad-soft: #FBE3E1;
  --good: #1B6E3B; --good-soft: #DDF1E4; --focus: #1B5FD0;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F171C; --surface: #18232A; --fg: #E6EDF1; --muted: #9AAAB5; --line: #2C3B45;
    --accent: #4FC3BA; --accent-ink: #06211F; --accent-soft: #17383A;
    --warn: #F0C26A; --warn-soft: #3A2F14; --bad: #FF8F86; --bad-soft: #40201E;
    --good: #7FD6A0; --good-soft: #173324; --focus: #7AA7FF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F171C; --surface: #18232A; --fg: #E6EDF1; --muted: #9AAAB5; --line: #2C3B45;
  --accent: #4FC3BA; --accent-ink: #06211F; --accent-soft: #17383A;
  --warn: #F0C26A; --warn-soft: #3A2F14; --bad: #FF8F86; --bad-soft: #40201E;
  --good: #7FD6A0; --good-soft: #173324; --focus: #7AA7FF; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 980px; margin: 0 auto; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button { font: inherit; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 18px 0; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
.brand { font-family: var(--font-mono); font-weight: 500; font-size: 15px; letter-spacing: .02em; }
.brand span { color: var(--muted); font-weight: 400; }
.proto { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); padding: 3px 9px; border-radius: 4px; }

h1 { font-size: 26px; line-height: 1.2; margin: 0 0 4px; font-weight: 600; text-wrap: balance; }
h2 { font-size: 16px; margin: 0 0 12px; font-weight: 600; }
.sub { color: var(--muted); margin: 0 0 24px; max-width: 65ch; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 9px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .6; cursor: progress; }
.btn.small { padding: 6px 12px; font-size: 14px; }
.link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; font: inherit; }

/* Dashboard */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; margin-bottom: 20px; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
.metric .k { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.metric .v { font-family: var(--font-mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.metric .n { font-size: 12px; color: var(--muted); }
.scale { position: relative; height: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; margin: 34px 0 30px; }
.scale .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; }
.tick { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--muted); }
.tick label { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }
.tick.top label { top: -22px; }

.rows { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) auto auto; gap: 16px; align-items: center; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.row .rt { font-weight: 600; }
.row .meta { color: var(--muted); font-size: 13px; }
.chip-status { font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
.chip-status.draft { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip-status.done { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip-status.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.simnote { border: 1px dashed var(--warn); background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 8px 12px; font-size: 13px; margin-bottom: 20px; }
.simtag { font-size: 11px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.banner.flag { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); }
.pill { display: inline-block; font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 999px; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.ok .mark.bad { background: var(--bad-soft); color: var(--bad); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500; }
.scroll-x { overflow-x: auto; }

/* Checklist */
.sticky { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.statusbar { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; }
.progress { flex: 1 1 200px; min-width: 0; }
.bar { height: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.bar > div { height: 100%; background: var(--accent); transition: width .2s; }
.timer { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 18px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 14px; align-items: center; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.field.pre { border-left: 4px solid var(--accent); }
.field.edited { border-left: 4px solid var(--warn); }
.field.verify { border-left: 4px solid var(--warn); }
.field.missing { border-left: 4px dashed var(--bad); }
.field.err { border-color: var(--bad); }
.flabel { font-weight: 500; font-size: 14px; display: block; }
.fhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.badge.prefilled { background: var(--accent-soft); color: var(--accent); }
.badge.edited, .badge.verify { background: var(--warn-soft); color: var(--warn); }
.badge.entered { background: var(--good-soft); color: var(--good); }
.badge.missing { background: var(--bad-soft); color: var(--bad); }
.input { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; min-width: 0; }
.input.invalid { border-color: var(--bad); }
.unitwrap { display: flex; align-items: center; gap: 8px; }
.unit { color: var(--muted); font-size: 13px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.errmsg { color: var(--bad); font-size: 13px; margin-top: 4px; font-weight: 500; }
.choice { display: flex; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 16px; cursor: pointer; background: var(--bg); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 500; }
.chip input { accent-color: var(--accent); }
.checkrow { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: 14px; }
.checkrow input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); }
.full { grid-column: 1 / -1; }

.banner { border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; font-size: 14px; }
.banner.bad { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); }
.banner ul { margin: 6px 0 0; padding-left: 18px; }
.banner.info { background: var(--accent-soft); color: var(--fg); border: 1px solid var(--line); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-top: 20px; }
.demo { border: 1px dashed var(--line); border-radius: 6px; padding: 8px 12px; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.saved { font-size: 12px; color: var(--muted); }

/* Confirmation */
.ok { display: flex; gap: 14px; align-items: center; margin-bottom: 20px; }
.ok .mark { width: 44px; height: 44px; border-radius: 50%; background: var(--good-soft); color: var(--good); display: grid; place-items: center; font-size: 22px; flex: none; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.fact .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.fact .v { font-family: var(--font-mono); font-size: 20px; font-variant-numeric: tabular-nums; }
dl.sum { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 6px 16px; margin: 0; font-size: 14px; }
dl.sum dt { color: var(--muted); }
dl.sum dd { margin: 0; overflow-wrap: anywhere; }

@media (max-width: 720px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .row { grid-template-columns: minmax(0, 1fr) auto; }
  .row .cov { grid-column: 1 / -1; }
  dl.sum { grid-template-columns: minmax(0, 1fr); }
  dl.sum dd { margin-bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  }
  var TODAY = todayStr();
  var BASELINE_MIN = 14.6, TARGET_MIN = 8, SCALE_MAX = 16;

  /* ---------- Mock compliance records (no external data) ---------- */
  var RECORDS = [
    { id: 'R-2041', routeName: 'North Loop 12', vehicle: 'TRK-318', driver: 'Maria Delgado',
      prefill: { route: 'R-2041 North Loop 12', vehicle: 'TRK-318', driver: 'Maria Delgado', licenseVerified: 'yes', inspection: 'yes', odometer: '184220', hoursLogged: '7.5', loadWeight: '18400', insuranceExpiry: '2027-03-31' },
      uncertain: [] },
    { id: 'R-2047', routeName: 'Harbor Express', vehicle: 'TRK-224', driver: 'Samir Haddad',
      prefill: { route: 'R-2047 Harbor Express', vehicle: 'TRK-224', driver: 'Samir Haddad', licenseVerified: 'yes', inspection: 'no', hoursLogged: '9', loadWeight: '21250' },
      uncertain: [] },
    { id: 'R-2052', routeName: 'Airport Cargo 7', vehicle: 'TRK-402', driver: 'Lena Fischer',

      uncertain: ['odometer'] }

  /* ---------- Required fields, all shown on one screen ---------- */
  var FIELDS = [
    { key: 'route', label: 'Route', type: 'text' },
    { key: 'vehicle', label: 'Vehicle', type: 'text' },
    { key: 'driver', label: 'Driver', type: 'text' },
    { key: 'licenseVerified', label: 'Driver license verified', type: 'choice', hint: 'Simulated rule: answering No flags the checklist as non-compliant.' },

  function findViolations(values) {

    if (values.licenseVerified === 'no') v.push('Driver license not verified');

    return { k: 'edited', t: 'Edited' };

  function fmtDur(sec) {
    sec = Math.max(0, Math.round(sec));

  }
  function prettyValue(f, v) {
    if (f.type === 'choice') return v === 'yes' ? 'Yes' : v === 'no' ? 'No' : '';

  }

  /* Simulated pilot history, for demonstration only */
  var SEED_LOG = [
    { id: 'R-2038', sec: 552, errors: 1, violations: 0, simulated: true },
    { id: 'R-2039', sec: 504, errors: 0, violations: 0, simulated: true },
    { id: 'R-2040', sec: 474, errors: 2, violations: 1, simulated: true }
  ];

  /* ---------- Shared UI ---------- */
  function TopBar(props) {
    return h('div', { className: 'topbar' },
      h('div', { className: 'brand' }, 'RouteLogic ', h('span', null, '/ Velocity pilot')),
      h('div', { className: 'proto' }, props.label));
  }

  /* ---------- Screen 1: Dashboard ---------- */

      h('h1', null, 'Today’s compliance checks'),
